<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="solution.css">
    <style>
        .board-game {
            display: grid;
            grid-template-columns: auto auto auto;
            padding: 10px;
            background-color: lightyellow;
            justify-content: space-between;
            gap: 10px;
        }

        .grid-square {
            background-color: lightgreen;
            padding: 15px;
            text-align: center;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <div class="board-game">
        <div class="grid-square">A1</div>
        <div class="grid-square">A2</div>
        <div class="grid-square">A3</div>
        <div class="grid-square">B1</div>
        <div class="grid-square">B2</div>
        <div class="grid-square">B3</div>
    </div>

</body>

</html>
